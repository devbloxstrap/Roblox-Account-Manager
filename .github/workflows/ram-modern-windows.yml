name: Build RAM Modern

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore RAM.Modern/RAM.Modern.csproj -r win-x64

      - name: Publish Windows executable
        run: dotnet publish RAM.Modern/RAM.Modern.csproj -c Release -r win-x64 --self-contained true --no-restore -p:PublishSingleFile=true -p:EnableCompressionInSingleFile=true -o publish

      - name: Upload Windows build
        uses: actions/upload-artifact@v4
        with:
          name: RAM-Modern-win-x64
          path: publish/
          if-no-files-found: error
